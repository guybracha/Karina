    <!-- 2) GA4 by measurementId from window.__ENV__ -->
    <script>
      (function initGA() {
        try {
          var E = (window.__ENV__ || {});
          var MID = E.FB_MEASUREMENT_ID;
          if (!MID || /^\$\{.+\}$/.test(String(MID))) return; // skip if placeholder
          var gtm = document.createElement("script");
          gtm.async = true;
          gtm.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(MID);
          document.head.appendChild(gtm);

          window.dataLayer = window.dataLayer || [];
          function gtag(){ dataLayer.push(arguments); }
          window.gtag = gtag;
          gtag("js", new Date());
          gtag("config", MID, { send_page_view: true });
        } catch (e) { console.warn("GA init skipped:", e); }
      })();
    </script>

    <!-- reCAPTCHA Enterprise (render with the same site key used by App Check) -->
    <script>
      (function loadRecaptchaEnterprise() {
        try {
          var env = window.__ENV__ || {};
          var key =
            env.RECAPTCHA_ENTERPRISE_SITE_KEY ||
            env.FB_RECAPTCHA_ENTERPRISE_KEY ||
            env.RECAPTCHA_SITE_KEY;
          if (!key || /^\$\{.+\}$/.test(String(key))) {
            console.warn("[AppCheck] Missing reCAPTCHA Enterprise site key in runtime env; skipping script injection.");
            return;
          }
          window.__recaptchaEnterpriseSiteKey = key;
          window.__recaptchaEnterpriseReady = new Promise(function (resolve, reject) {
            var script = document.createElement("script");
            script.src = "https://www.google.com/recaptcha/enterprise.js?render=" + encodeURIComponent(key);
            script.async = true;
            script.onload = function () {
              if (window.grecaptcha && window.grecaptcha.enterprise) {
                window.grecaptcha.enterprise.ready(function () {
                  resolve(window.grecaptcha);
                });
              } else {
                resolve(window.grecaptcha || null);
              }
            };
            script.onerror = function (err) {
              console.warn("[AppCheck] reCAPTCHA Enterprise script failed to load:", err);
              reject(err);
            };
            document.head.appendChild(script);
          });
        } catch (err) {
          console.warn("[AppCheck] reCAPTCHA Enterprise loader failed:", err);
        }
      })();
    </script>

    <!-- Optional: DEBUG helper for manual token test (hidden in production) -->
    <script>
      (function attachRecaptchaDebug(){
        try {
          var E = (window.__ENV__ || {});
          var DEBUG_ON = String(E.APP_DEBUG || "").toLowerCase() === "true";
          if (!DEBUG_ON) return; // expose only in debug mode

          window.__recaptchaTest = async function(evt){
            try {
              if (evt && evt.preventDefault) evt.preventDefault();
              var env = (window.__ENV__ || {});
              var key =
                window.__recaptchaEnterpriseSiteKey ||
                env.RECAPTCHA_ENTERPRISE_SITE_KEY ||
                env.FB_RECAPTCHA_ENTERPRISE_KEY ||
                env.RECAPTCHA_SITE_KEY;
              if (!key) {
                console.warn('[reCAPTCHA] site key missing; aborting debug execute.');
                return null;
              }
              if (!window.__recaptchaEnterpriseReady) {
                console.warn('[reCAPTCHA] loader promise missing; ensure loadRecaptchaEnterprise ran.');
                return null;
              }
              await window.__recaptchaEnterpriseReady;
              if (!window.grecaptcha || !window.grecaptcha.enterprise) {
                console.error('[reCAPTCHA] grecaptcha.enterprise unavailable after load.');
                return null;
              }
              const token = await window.grecaptcha.enterprise.execute(key, { action: 'login' });
              console.log('[reCAPTCHA] token:', token);
              return token;
            } catch (e) {
              console.error('[reCAPTCHA] execute failed:', e);
              return null;
            }
          };
          console.info('[reCAPTCHA] debug helper attached: window.__recaptchaTest()');
        } catch(e) {}
      })();
    </script>
