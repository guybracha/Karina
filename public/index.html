<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="קארינה חולצות מודפסות - בגדי עבודה ממותגים ואיכותיים לעסקים, צוותים ואירועים."
    />
    <meta
      name="google-site-verification"
      content="PffqXWWB9GbrIdYcb0-L-8INO4jgTbauDEkqgpHSpx8"
    />

    <!-- אייקונים ומניפסט (CRA: משתמשים ב-%PUBLIC_URL%) -->
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- canonical -->
    <link rel="canonical" href="https://karina.co.il/" />

    <title>קארינה חולצות מודפסות</title>

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />

    <!-- 1) טעינת ENV בזמן ריצה (חייב להיות לפני כל קוד שתלוי בו) -->
    <!-- אם האתר בשורש הדומיין, גם '/_ENV_.js' יעבוד. ב-CRA עדיף %PUBLIC_URL% -->
    <script src="%PUBLIC_URL%/_ENV_.js"></script>

    <!-- 2) GA4 לפי ה-measurementId מתוך window.__ENV__ -->
    <script>
      (function initGA() {
        try {
          var E = (window.__ENV__ || {});
          var MID = E.FB_MEASUREMENT_ID;

          // אם לא הוגדר measurementId אמיתי – אל תטען GA
          if (!MID || /^\$\{.+\}$/.test(String(MID))) return;

          var gtm = document.createElement("script");
          gtm.async = true;
          gtm.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(MID);
          document.head.appendChild(gtm);

          window.dataLayer = window.dataLayer || [];
          function gtag(){ dataLayer.push(arguments); }
          window.gtag = gtag;

          gtag("js", new Date());
          gtag("config", MID, { send_page_view: true });
        } catch (e) {
          console.warn("GA init skipped:", e);
        }
      })();
    </script>

    <!-- הערה: אין לטעון כאן reCAPTCHA Enterprise עם ?k=... כדי לא לקבע מפתח ב-HTML.
         ה-Firebase SDK של App Check יטען את הספרייה לפי ה-site key שב-window.__ENV__. -->
  </head>

  <body>
    <noscript>יש לאפשר JavaScript כדי להפעיל את האפליקציה.</noscript>
    <div id="root"></div>

    <!-- Bootstrap JS Bundle -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
