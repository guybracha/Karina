name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # ===== Build flags =====
      NPM_CONFIG_LEGACY_PEER_DEPS: true
      PUBLIC_URL: https://karina.co.il/
      CI: false
      DISABLE_ESLINT_PLUGIN: true

      # ===== Firebase (from Secrets) =====
      FB_API_KEY:              ${{ secrets.FB_API_KEY }}
      FB_AUTH_DOMAIN:          ${{ secrets.FB_AUTH_DOMAIN }}
      FB_PROJECT_ID:           ${{ secrets.FB_PROJECT_ID }}
      FB_STORAGE_BUCKET:       ${{ secrets.FB_STORAGE_BUCKET }}
      FB_MESSAGING_SENDER_ID:  ${{ secrets.FB_MESSAGING_SENDER_ID }}
      FB_APP_ID:               ${{ secrets.FB_APP_ID }}
      FB_MEASUREMENT_ID:       ${{ secrets.FB_MEASUREMENT_ID }}

      # ===== App Check (reCAPTCHA Enterprise) =====
      # IMPORTANT: This secret must equal 6LeSJ_crAAAAAIOZfuqfgAhdEk7d4u5H26WakOV4
      FB_RECAPTCHA_ENTERPRISE_KEY: ${{ secrets.FB_RECAPTCHA_ENTERPRISE_KEY }}
      # Optional flags
      APPCHECK_ENABLE: ${{ secrets.APPCHECK_ENABLE }}
      APPCHECK_DEBUG_TOKEN: ${{ secrets.APPCHECK_DEBUG_TOKEN }}

      # ===== Functions =====
      FB_FUNCTIONS_REGION: europe-west1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci || npm i

      - name: Verify Firebase & App Check env are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          required=( FB_API_KEY FB_AUTH_DOMAIN FB_PROJECT_ID FB_STORAGE_BUCKET FB_MESSAGING_SENDER_ID FB_APP_ID )
          for k in "${required[@]}"; do
            if [ -z "${!k:-}" ]; then
              echo "::error::Missing $k"
              missing=1
            else
              echo "✅ $k"
            fi
          done

          if [ -z "${FB_MEASUREMENT_ID:-}" ]; then
            echo "::warning::FB_MEASUREMENT_ID not set (Analytics off)."
          fi

          if [ -z "${FB_RECAPTCHA_ENTERPRISE_KEY:-}" ]; then
            echo "::warning::FB_RECAPTCHA_ENTERPRISE_KEY not set — App Check Enterprise will initialize only if enabled and key exists."
          else
            echo "✅ App Check site key provided"
          fi

          [ "$missing" -eq 1 ] && exit 1 || echo "ENV OK"

      - name: Build
        run: npm run build

      - name: Detect build dir
        id: detect
        run: |
          if [ -d dist ]; then
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          elif [ -d build ]; then
            echo "dir=build" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No dist/build directory produced by build"
            exit 1
          fi

      # Create runtime _ENV_.js (single underscore) consumed by index.html
      - name: Create runtime _ENV_.js
        shell: bash
        run: |
          set -euo pipefail
          d=${{ steps.detect.outputs.dir }}
          mkdir -p "$d"
          cat > "$d/_ENV_.js" << 'EOF'
          window.__ENV__ = {
            // ---- FB_* ----
            FB_API_KEY:              "${FB_API_KEY}",
            FB_AUTH_DOMAIN:          "${FB_AUTH_DOMAIN}",
            FB_PROJECT_ID:           "${FB_PROJECT_ID}",
            FB_STORAGE_BUCKET:       "${FB_STORAGE_BUCKET}",
            FB_MESSAGING_SENDER_ID:  "${FB_MESSAGING_SENDER_ID}",
            FB_APP_ID:               "${FB_APP_ID}",
            FB_MEASUREMENT_ID:       "${FB_MEASUREMENT_ID}",
            FB_RECAPTCHA_ENTERPRISE_KEY: "${FB_RECAPTCHA_ENTERPRISE_KEY}",
            FB_FUNCTIONS_REGION:     "${FB_FUNCTIONS_REGION}",

            // ---- App Check flags ----
            APPCHECK_ENABLE:         "${APPCHECK_ENABLE}",
            APPCHECK_DEBUG_TOKEN:    "${APPCHECK_DEBUG_TOKEN}",

            // ---- Mirrored REACT_APP_* for compatibility ----
            REACT_APP_FB_API_KEY:              "${FB_API_KEY}",
            REACT_APP_FB_AUTH_DOMAIN:          "${FB_AUTH_DOMAIN}",
            REACT_APP_FB_PROJECT_ID:           "${FB_PROJECT_ID}",
            REACT_APP_FB_STORAGE_BUCKET:       "${FB_STORAGE_BUCKET}",
            REACT_APP_FB_MESSAGING_SENDER_ID:  "${FB_MESSAGING_SENDER_ID}",
            REACT_APP_FB_APP_ID:               "${FB_APP_ID}",
            REACT_APP_FB_MEASUREMENT_ID:       "${FB_MEASUREMENT_ID}",
            REACT_APP_RECAPTCHA_ENTERPRISE_SITE_KEY: "${FB_RECAPTCHA_ENTERPRISE_KEY}",
            REACT_APP_FB_FUNCTIONS_REGION:     "${FB_FUNCTIONS_REGION}"
          };
          EOF

          # Sanity: ensure no placeholders remained
          if grep -q '\\${[A-Z_][A-Z0-9_]*}' "$d/_ENV_.js"; then
            echo "::error::Placeholders remained in _ENV_.js (variables not expanded).";
            sed -n '1,200p' "$d/_ENV_.js";
            exit 1;
          fi

      # Ensure _ENV_.js is referenced in index.html head
      - name: Inject _ENV_.js into index.html
        shell: bash
        run: |
          d=${{ steps.detect.outputs.dir }}
          index="$d/index.html"
          if [ -f "$index" ]; then
            if grep -q '</head>' "$index"; then
              if ! grep -q '_ENV_.js' "$index"; then
                sed -i 's#</head>#  <script src="/_ENV_.js"></script>\n</head>#' "$index"
                echo "Injected _ENV_.js into index.html"
              else
                echo "index.html already contains _ENV_.js"
              fi
            else
              echo "::warning::index.html missing </head> — please include <script src=\"/_ENV_.js\"></script> manually"
            fi
          else
            echo "::error::index.html not found under $d"
            exit 1
          fi

      - name: Add CNAME for custom domain
        run: echo "karina.co.il" > "${{ steps.detect.outputs.dir }}/CNAME"

      # SPA fallback to avoid 404 on deep links
      - name: Add 404.html for SPA
        run: |
          d=${{ steps.detect.outputs.dir }}
          if [ -f "$d/index.html" ]; then
            cp -f "$d/index.html" "$d/404.html"
            echo "Created SPA fallback 404.html"
          else
            echo "::warning::index.html not found for 404 fallback"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
