name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # למנוע כשלי peer deps בזמן התקנה
      NPM_CONFIG_LEGACY_PEER_DEPS: true
      # דומיין הייצור שלנו (לא תת-נתיב של /Karina/)
      PUBLIC_URL: https://karina.co.il/
      # לא לעצור על warnings בזמן build
      CI: false
      DISABLE_ESLINT_PLUGIN: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci || npm i

      # 👇 הזרקת ה-ENV של Firebase מה-Secrets בזמן build
      - name: Build
        run: npm run build
        env:
          REACT_APP_FB_API_KEY: ${{ secrets.REACT_APP_FB_API_KEY }}
          REACT_APP_FB_AUTH_DOMAIN: ${{ secrets.REACT_APP_FB_AUTH_DOMAIN }}
          REACT_APP_FB_PROJECT_ID: ${{ secrets.REACT_APP_FB_PROJECT_ID }}
          REACT_APP_FB_STORAGE_BUCKET: ${{ secrets.REACT_APP_FB_STORAGE_BUCKET }}
          REACT_APP_FB_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FB_MESSAGING_SENDER_ID }}
          REACT_APP_FB_APP_ID: ${{ secrets.REACT_APP_FB_APP_ID }}
          REACT_APP_FB_MEASUREMENT_ID: ${{ secrets.REACT_APP_FB_MEASUREMENT_ID }}

      - name: Detect build dir
        id: detect
        run: |
          if [ -d dist ]; then echo "dir=dist" >> "$GITHUB_OUTPUT";
          elif [ -d build ]; then echo "dir=build" >> "$GITHUB_OUTPUT";
          else echo "No dist/build dir"; exit 1; fi

      # 👇 קובץ CNAME כדי להצמיד את הדומיין ל-Pages
      - name: Add CNAME for custom domain
        run: echo "karina.co.il" > "${{ steps.detect.outputs.dir }}/CNAME"

      # 👇 SPA fallback כדי שכל נתיב יחזור ל-index.html
      - name: Add 404.html for SPA
        run: |
          d=${{ steps.detect.outputs.dir }}
          [ -f "$d/index.html" ] && cp "$d/index.html" "$d/404.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
